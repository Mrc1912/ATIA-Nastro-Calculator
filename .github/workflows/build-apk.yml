name: Compila APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compila APK
        run: gradle assembleDebug --stacktrace
      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ATIA-Nastro-Calculator-v1.2.0.apk
      - name: Pubblica APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: ATIA-Nastro-Calculator-APK
          path: ATIA-Nastro-Calculator-v1.2.0.apk
          retention-days: 30
